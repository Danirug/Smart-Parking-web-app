<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register — Smart Parking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="../css/style.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100 py-4">
      <div class="col-md-6 col-lg-5">
        <div class="text-center mb-4">
          <h1 class="h3 fw-bold">🅿️ Smart Parking</h1>
          <p class="text-muted">Create a new account</p>
        </div>
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <div id="alert"></div>
            <form id="registerForm">
              <div class="mb-3">
                <label for="fullName" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="fullName" required />
              </div>
              <div class="mb-3">
                <label for="emailId" class="form-label">Email</label>
                <input type="email" class="form-control" id="emailId" required />
              </div>
              <div class="mb-3">
                <label for="mobileNo" class="form-label">Mobile Number</label>
                <input type="tel" class="form-control" id="mobileNo" pattern="[0-9]{10}" required />
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" minlength="6" required />
              </div>
              <div class="mb-3">
                <label for="clientId" class="form-label">Parking Client</label>
                <select class="form-select" id="clientId" required>
                  <option value="">Loading clients...</option>
                </select>
              </div>
              <button type="submit" id="registerBtn" class="btn btn-primary w-100">Register</button>
            </form>
          </div>
        </div>
        <p class="text-center mt-3">
          Already have an account? <a href="login.html">Sign in</a>
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/pages/register.page.js"></script>
</body>
</html>
